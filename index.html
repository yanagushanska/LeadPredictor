<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  </head>
  <body>
    <header>
      <h1>LeadPredictor</h1>
    </header>

    <main>
      <aside aria-label="Calculator inputs">
        <form>
          <fieldset>
            <legend>Lead settings</legend>
            <div id="validation-error" style="display: none; color: #ff6b6b; font-size: 0.85rem; margin-bottom: 12px; padding: 8px; background: rgba(255, 107, 107, 0.1); border-radius: 6px;"></div>

            <div>
              <label for="language">Language</label>
              <select id="language" name="language">
                <option value="en">English</option>
              </select>
            </div>

            <div>
              <label for="currency">Currency</label>
              <select id="currency" name="currency">
                <option value="usd">US Dollar</option>
              </select>
            </div>

            <div>
              <label for="campaign-start">Campaign Start</label>
              <input id="campaign-start" name="campaignStart" type="text" placeholder="dd/mm/yyyy" />
            </div>

            <div>
              <label for="campaign-end">Campaign End</label>
              <input id="campaign-end" name="campaignEnd" type="text" placeholder="dd/mm/yyyy" />
            </div>

            <div>
              <label for="total-revenue">Total Revenue</label>
              <input id="total-revenue" name="totalRevenue" type="number" min="0" step="1" />
            </div>

            <div>
              <label for="avg-order-value">Avg. Order Value</label>
              <input id="avg-order-value" name="avgOrderValue" type="number" min="0" step="1" />
            </div>
            
            <button type="button" id="calculate-btn" style="width: 100%; margin-top: 16px; padding: 10px; background: #4a90e2; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9rem;">Calculate</button>
          </fieldset>
        </form>
      </aside>

      <section aria-label="Lead forecast chart">
        <h2>Forecast</h2>
        <div style="height:300px;">
          <canvas id="forecast-chart"></canvas>
        </div>
      </section>

      <section aria-label="Outcome summary">
        <h2>Summary</h2>

        <article>
          <h3>Prospects</h3>
          <p id="prospects-count">125</p>
          <p>100%</p>
        </article>

        <article>
          <h3>Leads</h3>
          <p id="leads-count">25</p>
          <p>20%</p>
        </article>

        <article>
          <h3>Customers</h3>
          <p id="customers-count">10</p>
          <p>8%</p>
        </article>
      </section>

      <section aria-label="Response rates">
        <h2>Response rates</h2>

        <div>
          <label for="lead-response-rate">Lead Response Rate</label>
          <div class="response-rate-wrapper">
            <input id="lead-response-rate" name="leadResponseRate" type="range" min="0" max="100" value="40" />
            <span class="response-rate-value" id="lead-response-value">40.00%</span>
          </div>
        </div>

        <div>
          <label for="prospect-response-rate">Prospect Response Rate</label>
          <div class="response-rate-wrapper">
            <input id="prospect-response-rate" name="prospectResponseRate" type="range" min="0" max="100" value="20" />
            <span class="response-rate-value" id="prospect-response-value">20.00%</span>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      // Initialize date pickers with dd/mm/yyyy format
      flatpickr('#campaign-start', {
        dateFormat: 'd/m/Y',
        allowInput: true
      });
      
      flatpickr('#campaign-end', {
        dateFormat: 'd/m/Y',
        allowInput: true
      });

      // Format date from yyyy-mm-dd to dd/mm/yyyy for display
      function formatDateDisplay(dateStr) {
        if (!dateStr) return '';
        const [year, month, day] = dateStr.split('-');
        return `${day}/${month}/${year}`;
      }

      // Update date display when date input changes
      document.getElementById('campaign-start').addEventListener('change', () => {
        // Flatpickr handles formatting automatically
      });

      document.getElementById('campaign-end').addEventListener('change', () => {
        // Flatpickr handles formatting automatically
      });

      // Validation function
      function validateForm() {
        const totalRevenue = document.getElementById('total-revenue').value.trim();
        const avgOrderValue = document.getElementById('avg-order-value').value.trim();
        const campaignStart = document.getElementById('campaign-start').value.trim();
        const campaignEnd = document.getElementById('campaign-end').value.trim();
        const errorDiv = document.getElementById('validation-error');
        
        if (!totalRevenue || !avgOrderValue || !campaignStart || !campaignEnd) {
          errorDiv.textContent = 'Please fill in all fields before calculating';
          errorDiv.style.display = 'block';
          return false;
        }
        
        errorDiv.style.display = 'none';
        return true;
      }

      // Formula 01: Calculate customers needed
      // customers = totalRevenue / avgOrderValue
      function calculateCustomers() {
        const totalRevenue = parseFloat(document.getElementById('total-revenue').value) || 0;
        const avgOrderValue = parseFloat(document.getElementById('avg-order-value').value) || 0;
        
        let customers = 0;
        if (totalRevenue > 0 && avgOrderValue > 0) {
          customers = Math.round(totalRevenue / avgOrderValue);
        }
        
        document.getElementById('customers-count').textContent = customers;
      }
      
      // Formula 02: Calculate leads from customers
      // leads = customers * 100 / leadResponseRate
      function calculateLeads() {
        const customersElement = document.getElementById('customers-count');
        const customers = parseInt(customersElement.textContent) || 0;
        const leadResponseRate = parseInt(document.getElementById('lead-response-rate').value) || 1;
        
        let leads = 0;
        if (customers > 0 && leadResponseRate > 0) {
          leads = Math.round(customers * 100 / leadResponseRate);
        }
        
        document.getElementById('leads-count').textContent = leads;
        calculateProspects();
      }
      
      // Formula 03: Calculate prospects from leads
      // prospects = leads * 100 / prospectResponseRate
      function calculateProspects() {
        const leadsElement = document.getElementById('leads-count');
        const leads = parseInt(leadsElement.textContent) || 0;
        const prospectResponseRate = parseInt(document.getElementById('prospect-response-rate').value) || 1;
        
        let prospects = 0;
        if (leads > 0 && prospectResponseRate > 0) {
          prospects = Math.round(leads * 100 / prospectResponseRate);
        }
        
        document.getElementById('prospects-count').textContent = prospects;
        if (typeof updateChart === 'function') updateChart();
      }
      
      // Calculate button click handler
      document.getElementById('calculate-btn').addEventListener('click', () => {
        if (validateForm()) {
          calculateCustomers();
          calculateLeads();
        }
      });
      
      // Allow Enter key in number inputs to trigger calculation
      document.getElementById('total-revenue').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('calculate-btn').click();
      });
      document.getElementById('avg-order-value').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('calculate-btn').click();
      });
      document.getElementById('campaign-start').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('calculate-btn').click();
      });
      document.getElementById('campaign-end').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('calculate-btn').click();
      });
      
      // Response rate sliders trigger immediate recalculation (no validation needed)
      document.getElementById('lead-response-rate').addEventListener('input', (e) => {
        document.getElementById('lead-response-value').textContent = parseFloat(e.target.value).toFixed(2) + '%';
        calculateLeads();
      });
      document.getElementById('prospect-response-rate').addEventListener('input', (e) => {
        document.getElementById('prospect-response-value').textContent = parseFloat(e.target.value).toFixed(2) + '%';
        calculateProspects();
      });

      // Chart.js: initialize a simple bar chart and provide an update function
      const ctx = document.getElementById('forecast-chart').getContext('2d');
      const forecastChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Prospects',
              backgroundColor: '#7fb3ff',
              data: [],
              stack: 'stack1'
            },
            {
              label: 'Leads',
              backgroundColor: '#4a90e2',
              data: [],
              stack: 'stack1'
            },
            {
              label: 'Customers',
              backgroundColor: '#2ecc71',
              data: [],
              stack: 'stack1'
            }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false, axis: 'y' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#2a3648',
              titleColor: '#fff',
              bodyColor: '#fff',
              callbacks: {
                title: (items) => {
                  const idx = items && items[0] ? items[0].dataIndex : 0;
                  const chart = items && items[0] ? items[0].chart : null;
                  const label = chart && chart.data.labels ? chart.data.labels[idx] : String(idx + 1);
                  return `Month #${label}`;
                },
                label: (context) => {
                  const idx = context.dataIndex;
                  const chart = context.chart;
                  const ds = chart.data.datasets[context.datasetIndex];
                  const cum = ds.data.slice(0, idx + 1).reduce((s, v) => s + (v || 0), 0);
                  return `${ds.label}: ${cum}`;
                },
                footer: (items) => {
                  const idx = items && items[0] ? items[0].dataIndex : 0;
                  const chart = items && items[0] ? items[0].chart : null;
                  const total = chart ? chart.data.datasets.reduce((sum, d) => sum + d.data.slice(0, idx + 1).reduce((s, v) => s + (v || 0), 0), 0) : 0;
                  return `Total: ${total}`;
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              beginAtZero: true,
              ticks: {
                callback: (value) => `${value} people`
              },
              grid: { color: 'rgba(255,255,255,0.03)' }
            },
            y: {
              stacked: true,
              grid: { display: false },
              ticks: { color: '#9fb0c8' }
            }
          },
          elements: {
            bar: { borderRadius: 8, barThickness: 18 }
          }
        }
      });

      function updateChart() {
        // Read totals from the summary DOM
        const totalProspects = parseInt(document.getElementById('prospects-count').textContent) || 0;
        const totalLeads = parseInt(document.getElementById('leads-count').textContent) || 0;
        const totalCustomers = parseInt(document.getElementById('customers-count').textContent) || 0;

        // Determine number of months from campaign dates (dd/mm/YYYY)
        function parseDDMMYYYY(str) {
          if (!str) return null;
          const parts = str.split('/');
          if (parts.length !== 3) return null;
          const day = parseInt(parts[0], 10);
          const month = parseInt(parts[1], 10) - 1;
          const year = parseInt(parts[2], 10);
          return new Date(year, month, day);
        }

        const start = parseDDMMYYYY(document.getElementById('campaign-start').value);
        const end = parseDDMMYYYY(document.getElementById('campaign-end').value);
        let months = 6;
        if (start && end && end > start) {
          months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth()) + 1;
          months = Math.max(1, Math.min(months, 12));
        }

        function distribute(total, n) {
          if (!total || n <= 0) return new Array(n).fill(0);
          const arr = [];
          for (let i = 1; i <= n; i++) {
            arr.push(Math.round((total / n) * i));
          }
          return arr;
        }

        const prospectsPerMonth = distribute(totalProspects, months);
        const leadsPerMonth = distribute(totalLeads, months);
        const customersPerMonth = distribute(totalCustomers, months);

        // labels: Month 1 .. Month N
        const labels = new Array(months).fill(0).map((_, i) => String(i + 1));

        forecastChart.data.labels = labels;
        forecastChart.data.datasets[0].data = prospectsPerMonth;
        forecastChart.data.datasets[1].data = leadsPerMonth;
        forecastChart.data.datasets[2].data = customersPerMonth;
        forecastChart.update();

        // Update summary progress bars (percent of prospects)
        const articles = document.querySelectorAll('section[aria-label="Outcome summary"] article');
        const pct = (value) => (totalProspects ? Math.round((value / totalProspects) * 100) : 0);
        if (articles.length >= 3) {
          articles[0].style.setProperty('--progress', '100%');
          articles[1].style.setProperty('--progress', pct(totalLeads) + '%');
          articles[2].style.setProperty('--progress', pct(totalCustomers) + '%');
        }
      }

      // call once to render initial state
      updateChart();
    </script>
  </body>
</html>
